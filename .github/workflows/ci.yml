name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same branch or pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      # setup-vp installs Vite+, provisions Node, detects the package manager,
      # and restores dependency-cache data. Pin by immutable commit, not @v1.
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: '24'
          cache: true
          runInstall: true

      - name: Quality gate
        run: vp check

      - name: Test
        run: vp test

      - name: Build
        run: vp build
